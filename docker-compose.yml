version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: lab-asset-backend
    restart: unless-stopped
    environment:
      - PORT=5000
      # Use existing MongoDB on the host machine
      - MONGODB_URI=mongodb://host.docker.internal:27017/lab-asset-management
      - JWT_SECRET=your-secret-key-change-in-production
      - NODE_ENV=production
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=http://localhost:5000/api
    container_name: lab-asset-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
